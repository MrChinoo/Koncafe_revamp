<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta
      name="description"
      content="Explora el kiosco de pedidos KonCafe: personaliza bebidas, arma tu pedido y conoce una experiencia de cafetería digital. Demostración interactiva sin cobros reales."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css?v=20261016-3" />
    <title>KonCafe — Kiosco de pedidos · Demo</title>
    <script type="module" src="/app.js?v=20261016-3"></script>
    <script type="module" src="/chat-help.js?v=20261016-3"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header" id="site-header"></header>
      <main id="app" tabindex="-1"></main>
      <footer class="site-footer">
        <span
          >KonCafe <span class="footer-sparkle">✳</span> Kiosco
          interactivo</span
        >
        <span>Demostración comercial · Sin cobros ni pedidos reales</span>
      </footer>
    </div>
    <div id="modal-root"></div>
    <div id="assistant-root"></div>
    <div id="boot-screen" class="boot-screen" role="status" aria-label="Preparando el kiosco">
      <div class="boot-loader" aria-hidden="true">
        <span class="boot-loader-ring"></span>
        <img src="/favicon.svg" alt="" width="64" height="64" />
      </div>
      <p>Preparando tu experiencia</p>
    </div>
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  </body>
</html>
